# ==============================================================================
# Account & Active Holdings Configuration
# (Can also be edited and saved visually in the "Positions & Risk" UI tab)
# ==============================================================================

account:
  total_equity_usd: 100000.0       # Total US equity account size (USD) for position sizing
  cash_usd: 15000.0                # Available cash balance (USD)
  max_risk_per_trade_pct: 1.25     # Max stop-loss risk per trade as % of equity (typical swing: 1.0% - 1.5%)
  max_single_position_pct: 20.0    # Max weight cap per single position (%)
  max_sector_exposure_pct: 45.0    # Max exposure warning threshold per sector (%)
  min_reward_risk_ratio: 2.0       # Minimum reward-to-risk threshold for opening new positions
  holding_horizon_days: 30         # Target holding period (20-45 trading days, ~1-2 months)

# Current holdings (pre-populated with 6 core tickers; update shares & avg_cost in the UI)
holdings:
  - symbol: "GOOG"
    shares: 50
    avg_cost: 0.0                  # Set to 0 if cost basis is not entered yet (uses latest close for valuation)
    stop_loss: 0.0                 # Optional manual stop-loss; 0 = auto-calculated via structure + ATR
    thesis: "云与 AI 核心底仓"
